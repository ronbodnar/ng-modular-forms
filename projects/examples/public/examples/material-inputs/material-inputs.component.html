<form [formGroup]="form">
  <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
    <nmf-mat-text
      formControlName="text"
      label="Text Input"
      placeholder="Input some text..."
    />

    <nmf-mat-number
      formControlName="number"
      label="Number Input"
      placeholder="Enter a number"
    />

    <nmf-mat-number
      formControlName="numberFormatted"
      label="Number Input (formatted)"
      placeholder="Enter a number"
      [formatValue]="true"
    />

    <nmf-mat-text
      formControlName="password"
      label="Password Input"
      type="password"
      placeholder="Enter a strong password"
    />

    <nmf-mat-currency
      formControlName="currency"
      label="Currency Input"
      placeholder="Enter your budget"
    />

    <nmf-mat-select
      formControlName="select"
      label="Select/Dropdown Input"
      [options]="countrySelectOptions"
      placeholder="Select an option"
    />

    <nmf-mat-datepicker formControlName="date" label="Date Input" />

    <nmf-mat-timepicker formControlName="time" label="Time Input" />

    <nmf-mat-lookup
      formControlName="lookupSync"
      label="Lookup Input"
      placeholder="Type to look up an option..."
      [optionsSource]="countryLookupOptions"
      [displayWith]="displayCountry"
    />

    <nmf-mat-lookup
      formControlName="lookupAsync"
      label="Lookup Input"
      placeholder="Type to look up an option..."
      [optionsProvider]="countryProvider"
      [displayWith]="displayCountryAsync"
    />

    <nmf-mat-textarea
      formControlName="textarea"
      label="Textarea Input"
      placeholder="Tell us about yourself..."
      [rows]="4"
    />

    <nmf-mat-range
      formControlName="range"
      label="Range Input"
      type="range"
      [min]="0"
      [max]="1000"
      [step]="10"
    />
  </div>

  <div class="col-start-1" formArrayName="array">
    @for (
      substitute of arrayControl.controls;
      track substitute;
      let i = $index
    ) {
      <div class="flex items-center gap-4" [formGroupName]="i">
        <nmf-mat-text
          class="grow"
          formControlName="text"
          placeholder="Enter some text"
          autocompelete="off"
          [label]="'Text ' + (i + 1)"
        />

        <button
          class="self-start mt-3"
          type="button"
          (click)="arrayControl.removeAt(i)"
        >
          Remove
        </button>
      </div>
    }

    <button
      type="button"
      (click)="arrayControl.push(arrayGroup)"
      [disabled]="arrayControl.length >= 5"
    >
      Add Item
    </button>
  </div>
</form>

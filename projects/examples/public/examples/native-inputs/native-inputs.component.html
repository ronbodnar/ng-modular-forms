<form [formGroup]="form">
  <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
    <nmf-text
      formControlName="text"
      label="Text Input"
      placeholder="Input some text..."
      [loading]="loading()"
    />

    <nmf-number
      formControlName="number"
      label="Number Input"
      type="number"
      placeholder="Enter a number"
      [loading]="loading()"
    />

    <nmf-number
      formControlName="numberFormatted"
      label="Number Input (formatted)"
      type="number"
      placeholder="Enter a number"
      [loading]="loading()"
      [formatValue]="true"
    />

    <nmf-text
      formControlName="password"
      label="Password Input"
      type="password"
      placeholder="Enter a strong password"
      [loading]="loading()"
    />

    <!-- Can use either content projection or the prefix/suffix inputs -->
    <nmf-number
      formControlName="currency"
      label="Currency Input"
      placeholder="Enter your budget"
      autocomplete="off"
      prefix="$"
      [loading]="loading()"
      [formatValue]="true"
      ><span nmfSuffix>USD</span></nmf-number
    >

    <nmf-datepicker
      formControlName="date"
      label="Date Input"
      placeholder="Select a date"
      [loading]="loading()"
    />

    <nmf-timepicker
      formControlName="time"
      label="Time Input"
      placeholder="Select a time"
      [loading]="loading()"
    />

    <nmf-select
      formControlName="select"
      label="Select/Dropdown Input"
      placeholder="Select an option"
      [loading]="loading()"
      [options]="countrySelectOptions"
    />

    <nmf-lookup
      formControlName="lookupSync"
      label="Lookup Input"
      placeholder="Type to look up an option..."
      autocomplete="off"
      [optionsSource]="countryLookupOptions"
      [displayWith]="displayCountry"
      [loading]="loading()"
    />

    <nmf-lookup
      formControlName="lookupAsync"
      label="Lookup Input (Async)"
      placeholder="Type to look up an option..."
      autocomplete="off"
      [optionsProvider]="countryProvider"
      [displayWith]="displayCountryAsync"
      [loading]="loading()"
    />

    <nmf-textarea
      formControlName="textarea"
      label="Textarea Input"
      placeholder="Tell us about yourself..."
      [loading]="loading()"
      [rows]="4"
    />

    <nmf-range
      formControlName="range"
      label="Range Input"
      type="range"
      placeholder="Enter a number"
      autocomplete="off"
      [min]="0"
      [max]="100"
      [loading]="loading()"
    />

    <nmf-file-selector
      formControlName="file"
      label="File Selector Input"
      placeholder="Select a file..."
      autocomplete="off"
      [multiple]="true"
    />
  </div>
</form>

<div
  class="flex flex-col min-h-screen bg-primary text-text font-sans selection:bg-accent/30"
>
  <nav
    class="flex justify-between px-4 py-2 items-center bg-tertiary sticky top-0 z-10"
  >
    <div class="flex gap-2 items-center">
      <a class="flex gap-2 items-center" routerLink="/">
        <img src="favicon.png" width="40" height="40" />
        <h1 class="text-lg text-text leading-tight">ng-modular-forms</h1>
      </a>

      @for (navLink of navigationLinks; track navLink.label) {
        <button mat-button routerLink="{{ navLink.path }}">
          {{ navLink.label }}
        </button>
      }
    </div>

    <div class="flex gap-6 items-center">
      <button
        mat-icon-button
        class="text-text!"
        (click)="setNextTheme()"
        [matTooltip]="nextThemeLabel()"
      >
        <mat-icon>{{ nextThemeIcon() }}</mat-icon>
      </button>

      <ng-container *ngTemplateOutlet="githubButton"></ng-container>
      <ng-container *ngTemplateOutlet="npmButton"></ng-container>
    </div>
  </nav>

  <router-outlet></router-outlet>

  <footer
    class="mx-auto w-full max-w-5xl flex justify-between items-center text-[12px] uppercase tracking-widest"
  >
    <p class="text-text opacity-40">&copy; 2026 ng-modular-forms</p>
    <div class="flex gap-6 opacity-80">
      <ng-container *ngTemplateOutlet="githubButton"></ng-container>
      <ng-container *ngTemplateOutlet="npmButton"></ng-container>
    </div>
  </footer>
</div>

<ng-template #githubButton>
  <a
    mat-icon-button
    class="text-text!"
    href="https://github.com/ronbodnar/ng-modular-forms/"
    target="_blank"
    title="View project on GitHub"
    aria-label="GitHub"
    aria-hidden="true"
  >
    <app-tech-icon class="text-text!" [name]="'github'" [label]="'GitHub'" />
  </a>
</ng-template>

<ng-template #npmButton>
  <a
    mat-icon-button
    href="https://www.npmjs.com/package/@ng-modular-forms/core"
    target="_blank"
    title="View package on NPM"
    aria-label="NPM"
    aria-hidden="true"
  >
    <app-tech-icon class="text-[#CB3837]" [name]="'npm'" [label]="'NPM'" />
  </a>
</ng-template>

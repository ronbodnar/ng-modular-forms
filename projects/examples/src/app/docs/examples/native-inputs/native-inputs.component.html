<app-docs-page
  title="Native Input Components"
  [bodyClass]="'self-stretch pt-6'"
>
  <form
    [formGroup]="options"
    class="grid grid-cols-2 mb-6 lg:mb-3 lg:flex gap-4"
  >
    <input type="checkbox" formControlName="loading" />Show Loading
    <input type="checkbox" formControlName="disabled" />Disable Inputs

    <button (click)="populateForm()">Populate Form</button>
    <button (click)="validateForm()">Validate Form</button>
  </form>

  <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
    <div class="flex flex-col gap-4">
      <app-form-section title="Input Types">
        <form [formGroup]="form">
          <div class="grid grid-cols-1 lg:grid-cols-2 gap-2">
            <nmf-text
              formControlName="text"
              label="Text Input"
              placeholder="Input some text..."
              autocomplete="off"
              [loading]="loading()"
            />

            <nmf-number
              formControlName="number"
              label="Number Input"
              placeholder="Enter a number"
              autocomplete="off"
              [loading]="loading()"
            />

            <nmf-number
              formControlName="numberFormatted"
              label="Number Input (formatted)"
              placeholder="Enter a number"
              autocomplete="off"
              [min]="0"
              [max]="100"
              [step]="5"
              [loading]="loading()"
              [formatValue]="true"
            />

            <nmf-range
              formControlName="numberRange"
              label="Number Input (range)"
              type="range"
              placeholder="Enter a number"
              autocomplete="off"
              [min]="0"
              [max]="100"
              [loading]="loading()"
            />

            <nmf-text
              formControlName="password"
              label="Password Input"
              type="password"
              placeholder="Enter a strong password"
              autocomplete="off"
              [loading]="loading()"
            />

            <!-- Can use either content projection or the prefix/suffix inputs -->
            <nmf-number
              formControlName="currency"
              label="Currency Input"
              placeholder="Enter your budget"
              autocomplete="off"
              prefix="$"
              [loading]="loading()"
              [formatValue]="true"
              ><span nmfSuffix>USD</span></nmf-number
            >

            <nmf-datepicker
              formControlName="date"
              label="Date Input"
              placeholder="Select a date"
              autocomplete="off"
              [loading]="loading()"
            />

            <nmf-timepicker
              formControlName="time"
              label="Time Input"
              placeholder="Select a time"
              autocomplete="off"
              [loading]="loading()"
            />

            <nmf-select
              formControlName="select"
              label="Select/Dropdown Input"
              placeholder="Select an option"
              autocomplete="off"
              [loading]="loading()"
              [options]="countrySelectOptions"
            />

            <nmf-lookup
              formControlName="lookupSync"
              label="Lookup Input"
              placeholder="Type to look up an option..."
              autocomplete="off"
              [optionsSource]="countryLookupOptions"
              [displayWith]="displayCountry"
              [loading]="loading()"
            />

            <nmf-lookup
              formControlName="lookupAsync"
              label="Lookup Input (Async)"
              placeholder="Type to look up an option..."
              autocomplete="off"
              [optionsProvider]="countryProvider"
              [displayWith]="displayCountryAsync"
              [loading]="loading()"
            />

            <nmf-textarea
              formControlName="textarea"
              label="Textarea Input"
              placeholder="Tell us about yourself..."
              autocomplete="off"
              [loading]="loading()"
              [rows]="4"
            />
          </div>
        </form>
      </app-form-section>

      <app-form-section title="Arrays" [formGroup]="form">
        <div class="col-start-1" formArrayName="array">
          @for (
            substitute of arrayControl.controls;
            track substitute;
            let i = $index
          ) {
            <div class="flex items-center gap-4" [formGroupName]="i">
              <nmf-text
                class="grow"
                formControlName="text"
                placeholder="Enter some text"
                autocompelete="off"
                [label]="'Text ' + (i + 1)"
                [loading]="loading()"
              />

              <button type="button" (click)="arrayControl.removeAt(i)">
                Remove
              </button>
            </div>
          }

          <button
            type="button"
            (click)="arrayControl.push(arrayGroup)"
            [disabled]="arrayControl.length >= 5"
          >
            Add Item
          </button>
        </div>
      </app-form-section>
    </div>

    <app-form-status-output [output]="form.value" [files]="files" />
  </div>
</app-docs-page>

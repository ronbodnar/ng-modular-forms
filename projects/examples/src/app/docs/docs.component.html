<div class="flex gap-4 px-4 mt-6">
  <nav class="flex flex-col gap-4">
    @for (navLink of navigationSections; track navLink) {
      <h2 class="text-xs uppercase tracking-widest">
        {{ navLink }}
      </h2>
      @for (navItem of navigationItems[navLink]; track navItem) {
        <a
          class="p-2 pl-4 pr-10 rounded no-underline shadow-sm hover:shadow-lg ring-accent"
          [class.ring-2]="router.url === navItem.path"
          [routerLink]="navItem.path"
          >{{ navItem.label }}</a
        >
      }
    }
  </nav>

  <div class="flex flex-1 bg-secondary rounded w-full mb-4 shadow-sm">
    <div class="w-full p-4">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>

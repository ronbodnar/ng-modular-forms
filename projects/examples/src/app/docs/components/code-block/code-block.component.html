<div class="relative bg-primary overflow-auto" [ngClass]="classList()">
  @if (!loadingCode()) {
    <button
      type="button"
      class="absolute top-3 right-3 flex items-center gap-2 px-2.5 py-1 text-xs rounded-md border border-tertiary bg-primary opacity-80 hover:opacity-50 transition-opacity"
      [class.cursor-pointer]="!isCopied(id())"
      [attr.aria-label]="isCopied(id()) ? 'Copied' : 'Copy code'"
      (click)="copyCode(id(), code())"
    >
      <mat-icon class="size-4! text-xs!">
        {{ isCopied(id()) ? "check" : "content_copy" }}
      </mat-icon>

      {{ isCopied(id()) ? "Copied" : "Copy" }}
    </button>
  } @else {
    <div class="p-4 space-y-2 animate-pulse">
      <div class="h-3 w-3/4 bg-tertiary/30 rounded"></div>
      <div class="h-3 w-2/3 bg-tertiary/30 rounded"></div>
      <div class="h-3 w-5/6 bg-tertiary/30 rounded"></div>
      <div class="h-3 w-1/2 bg-tertiary/30 rounded"></div>
    </div>
  }

  <pre
    [hidden]="loadingCode()"
    class="m-0 text-xs font-mono leading-normal whitespace-pre"
  ><code [highlight]="code()" [language]="language()" (highlighted)="onCodeReady($event)"></code></pre>
</div>

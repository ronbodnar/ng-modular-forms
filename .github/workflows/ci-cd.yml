name: CI CD Pipeline

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NODE_VERSION: "24"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: npm ci

      - name: Lint projects
        run: npm run lint:projects

      - name: Run tests
        run: npm run test

      - name: Build examples
        run: npm run build -- examples

      - name: Add SPA fallback for GitHub Pages
        run: cp dist/examples/browser/index.html dist/examples/browser/404.html

      - name: Build packages
        run: npm run build:all

      - name: Stamp version
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/stamp-version.js
        env:
          VERSION: ${{ github.ref_name }}

      - name: Create release zip
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          zip -r ng-modular-forms-${{ github.ref_name }}.zip \
            dist/core dist/material README.md LICENSE

      - name: Upload examples site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/examples/browser

      - name: Upload core package
        uses: actions/upload-artifact@v7
        with:
          name: core-package
          path: dist/core
          if-no-files-found: error

      - name: Upload material package
        uses: actions/upload-artifact@v7
        with:
          name: material-package
          path: dist/material
          if-no-files-found: error

      - name: Upload release zip
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release-zip
          path: ng-modular-forms-*.zip
          if-no-files-found: error

  deploy-gh-pages:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main'

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Setup
        uses: actions/configure-pages@v6

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

  deploy-npm-core:
    name: Deploy Core Package to NPM
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      id-token: write

    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org/

      - name: Download package
        uses: actions/download-artifact@v8
        with:
          name: core-package
          path: core-package

      - name: Publish
        working-directory: core-package
        run: npm publish --access public

  deploy-npm-material:
    name: Deploy Material Package to NPM
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      id-token: write

    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org/

      - name: Download package
        uses: actions/download-artifact@v8
        with:
          name: material-package
          path: material-package

      - name: Publish
        working-directory: material-package
        run: npm publish --access public

  create-github-release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, deploy-npm-core, deploy-npm-material]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download release zip
        uses: actions/download-artifact@v8
        with:
          name: release-zip

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: ng-modular-forms-*.zip
          generate_release_notes: true
